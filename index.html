<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Show Project | Zadri Abdule (Zadri415)</title>
    <link href="style.css" rel="stylesheet" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <h1>TV Show Episodes</h1>

    <search>
      <label for="movie">Find an episode</label>
      <input
        type="search"
        id="episode"
        name="q"
        oninput="handleSearch(event)"
      />
    </search>

    <div id="root"></div>

    <!-- Template for an episode card. JavaScript can clone this and fill in the fields. -->
    <template id="episode-template">
      <article class="episode-card">
        <h2 class="episode-title">Episode Title - S00E00</h2>
        <img class="episode-image" src="" alt="Episode image" />
        <p class="episode-summary"></p>
      </article>
    </template>

    <footer>
      Episode Data from
      <a href="https://www.tvmaze.com/">TVMaze.com</a>
    </footer>

    <!-- Loads a provided function called getAllEpisodes() which returns all episodes -->
    <script src="episodes.js"></script>

    <!-- Loads YOUR javascript code -->
    <script src="script.js"></script>
  </body>
</html>
