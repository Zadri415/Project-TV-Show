<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Show Project | Zadri Abdule (Zadri415)</title>
    <link href="style.css" rel="stylesheet" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <h1>TV Shows</h1>

    <!-- SHOWS LISTING VIEW -->
    <section id="shows-view">
      <label>
        Search shows
        <input
          type="search"
          id="show-search"
          placeholder="Search by name, genre, or summary"
        />
        🔍
      </label>
      <p id="shows-count"></p>

      <div id="shows-grid"></div>

      <!-- Template for a show card. JavaScript clones this and fills in the fields. -->
      <template id="show-template">
        <article class="show-card">
          <h2><button type="button" class="show-name"></button></h2>
          <img class="show-image" src="" alt="" />
          <p class="show-summary"></p>
          <p class="show-genres"></p>
          <p class="show-status"></p>
          <p class="show-rating"></p>
          <p class="show-runtime"></p>
        </article>
      </template>
    </section>

    <!-- EPISODES VIEW (hidden until a show is opened) -->
    <section id="episodes-view" class="hidden">
      <button id="back-to-shows" type="button">&larr; Back to shows</button>
      <h2 id="current-show-name"></h2>

      <label for="episode-select">Choose an episode:</label>
      <select id="episode-select">
        <option value="">Show all episodes</option>
      </select>

      <!-- Search bar -->
      <label>
        Search
        <input type="search" id="episode-search" placeholder="Search term" /> 🔍
      </label>
      <span id="search-count"></span>

      <div id="root"></div>

      <!-- Template for an episode card. JavaScript can clone this and fill in the fields. -->
      <template id="episode-template">
        <article>
          <h2>Episode Title - S00E00</h2>
          <img src="" alt="" />
          <p></p>
        </article>
      </template>
    </section>

    <footer>
      Episode Data from
      <a href="https://www.tvmaze.com/">TVMaze.com</a>
    </footer>

    <!-- Loads YOUR javascript code -->
    <script src="script.js"></script>
  </body>
</html>
