<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Show Project | Zadri Abdule (Zadri415)</title>
    <link href="style.css" rel="stylesheet" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <!-- Episode select drop-down menu -->
    <label for="episode-select">Choose an episode:</label>
    <select id="episode-select">
      <option value="">Show all episodes</option>
    </select>

    <!-- Search bar -->
    <label>
      Search
      <input type="search" id="episode-search" placeholder="Search term" /> 🔍
    </label>
    <span id="search-count"></span>

    <h1>TV Show Episodes</h1>
    <div id="root"></div>

    <!-- Template for an episode card. JavaScript can clone this and fill in the fields. -->
    <template id="episode-template">
      <article>
        <h2>Episode Title - S00E00</h2>
        <img src="" />
        <p></p>
      </article>
    </template>

    <footer>
      Episode Data from
      <a href="https://www.tvmaze.com/">TVMaze.com</a>
    </footer>

    <!-- Loads a provided function called getAllEpisodes() which returns all episodes -->

    <!-- Loads YOUR javascript code -->
    <script src="script.js"></script>
  </body>
</html>
