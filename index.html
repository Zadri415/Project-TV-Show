<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Show Project | Zadri Abdule (Zadri415)</title>
    <link href="style.css" rel="stylesheet" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <!-- SHOWS LISTING VIEW -->
    <section id="shows-view">
      <div id="shows-controls">
        <input
          type="text"
          id="show-search"
          placeholder="Search shows by name, genre, or summary..."
        />
        <p id="shows-count"></p>
      </div>
      <div id="shows-grid"></div>
    </section>

    <!-- EPISODES VIEW (hidden until a show is selected) -->
    <section id="episodes-view" class="hidden">
      <button id="back-to-shows" type="button">&larr; Back to shows</button>
      <h2 id="current-show-name"></h2>

      <div id="root"></div>
      <div id="controls">
        <input type="text" id="search-input" placeholder="Search episodes..." />
        <select id="episode-select"></select>
      </div>

      <template id="episode-card">
        <article>
          <h1 class="title"></h1>
          <img class="thumb" />
          <p class="description"></p>
        </article>
      </template>

      <div id="grid"></div>
    </section>

    <template id="show-card">
      <article class="show-card">
        <h2 class="show-name"></h2>
        <img class="show-image" />
        <p class="show-summary"></p>
        <p class="show-genres"></p>
        <p class="show-status"></p>
        <p class="show-rating"></p>
        <p class="show-runtime"></p>
      </article>
    </template>

    <template id="error">
      <article class="error-card">
        <h1>Something went wrong</h1>
        <p class="error-message"></p>
      </article>
    </template>

    <!-- Loads YOUR javascript code -->
    <script type="module" src="script.js"></script>

    <footer>
      <p id="footer">
        The data on this website has (originally) come from
        <a href="TVMaze.com">TVMaze.com</a>
      </p>
    </footer>
  </body>
</html>
